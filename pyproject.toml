[project]
name = "secunda"
version = "0.1.0"
description = "Asynchronous payment processing service"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = [
    "aiohttp>=3.13.3",
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "faststream[cli,rabbit]>=0.7.7",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "starlette>=1.7.0",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "unit: isolated test with no network, broker, or database",
    "integration: test against PostgreSQL supplied in TEST_DATABASE_URL",
    "e2e: transport contract test through ASGI or FastStream TestRabbitBroker",
    "transactional_db: run inside a transaction rolled back after the test",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
